name: Android Play Store (AAB signé)

# Lancement manuel : GitHub → Actions → « Android Play Store (AAB signé) » → Run workflow
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version affichée (ex. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Vérifier les secrets de signature
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant (voir README, section Google Play)."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'app web (mode mobile)
        run: npm run build:mobile

      - name: Synchroniser Capacitor Android
        run: npx cap sync android

      - name: Préparer la clé d'envoi
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Compiler l'AAB signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FindMyCoach-play-store-${{ inputs.version_name }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
