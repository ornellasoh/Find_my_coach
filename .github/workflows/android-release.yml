name: Android Play Store (AAB signé)

# Automatique : chaque envoi sur main qui touche l'app part en test interne Google Play.
# Manuel : GitHub → Actions → « Android Play Store (AAB signé) » → Run workflow (choix de la piste et des nouveautés).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version affichée (ex. 1.0.0)"
        required: true
        default: "1.0.0"
      track:
        description: "Piste Google Play (envoi automatique si le secret PLAY_SERVICE_ACCOUNT_JSON existe)"
        required: true
        default: "internal"
        type: choice
        options: [internal, alpha, beta, production]
      release_notes:
        description: "Nouveautés (français, 500 caractères max.)"
        required: false
        default: "Corrections et améliorations."

# Un seul envoi à la fois : un nouvel envoi sur main remplace celui en attente
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paramètres de la version
        id: rel
        env:
          IN_VERSION: ${{ inputs.version_name }}
          IN_TRACK: ${{ inputs.track }}
          IN_NOTES: ${{ inputs.release_notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${IN_VERSION:-$(node -p "require('./package.json').version")}"
          TRACK="${IN_TRACK:-internal}"
          # Nouveautés : saisies à la main, sinon la première ligne du message du commit
          NOTES="${IN_NOTES:-$(printf '%s' "$COMMIT_MSG" | head -n 1)}"
          NOTES="${NOTES:-Corrections et améliorations.}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "track=$TRACK" >> "$GITHUB_OUTPUT"
          { echo "notes<<FMC_EOF"; printf '%s\n' "$NOTES"; echo "FMC_EOF"; } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($GITHUB_RUN_NUMBER), piste $TRACK"

      - name: Vérifier les secrets de signature
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant (voir README, section Google Play)."
            exit 1
          fi

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'app web (mode mobile)
        run: npm run build:mobile

      - name: Synchroniser Capacitor Android
        run: npx cap sync android

      - name: Préparer la clé d'envoi
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Compiler l'AAB signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.rel.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FindMyCoach-play-store-${{ steps.rel.outputs.version }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab

      # Envoi automatique vers la Play Console (API officielle Google Play, compte de service).
      # Sans le secret PLAY_SERVICE_ACCOUNT_JSON, l'AAB reste à télécharger dans les artefacts et à envoyer à la main.
      - name: Préparer les nouveautés
        if: ${{ env.HAS_PLAY_KEY == 'true' }}
        env:
          NOTES: ${{ steps.rel.outputs.notes }}
        run: |
          mkdir -p whatsnew
          printf '%s' "$NOTES" | head -c 500 > whatsnew/whatsnew-fr-FR

      - name: Envoyer vers Google Play (piste ${{ steps.rel.outputs.track }})
        if: ${{ env.HAS_PLAY_KEY == 'true' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.findmycoach.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ steps.rel.outputs.track }}
          # Piste de test : publiée tout de suite aux testeurs. Production : brouillon, à valider dans la Play Console.
          status: ${{ steps.rel.outputs.track == 'production' && 'draft' || 'completed' }}
          releaseName: ${{ steps.rel.outputs.version }} (${{ github.run_number }})
          whatsNewDirectory: whatsnew

      - name: Rappel (envoi manuel)
        if: ${{ env.HAS_PLAY_KEY != 'true' }}
        run: |
          echo "::notice::Secret PLAY_SERVICE_ACCOUNT_JSON absent. Téléchargez l'AAB dans les artefacts et envoyez-le à la main dans la Play Console."
