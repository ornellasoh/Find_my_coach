name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_STORAGE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'app web (mode mobile)
        run: npm run build:mobile

      - name: Synchroniser Capacitor Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FindMyCoach-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK sur findmycoach.io (Supabase Storage)
        if: ${{ env.HAS_STORAGE_KEY == 'true' }}
        env:
          SUPABASE_URL: https://seftoygihefwohrioojo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          VERSION="1.0.${{ github.run_number }}"
          SIZE=$(stat -c%s "$APK")
          BASE="$SUPABASE_URL/storage/v1/object/downloads"
          PUBLIC="$SUPABASE_URL/storage/v1/object/public/downloads"
          # Fichier daté + copie « latest » (lien fixe pour le site)
          for NAME in "findmycoach-$VERSION.apk" "findmycoach-latest.apk"; do
            curl -sSf -X POST "$BASE/$NAME" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "x-upsert: true" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK"
          done
          cat > version.json <<JSON
          {"version":"$VERSION","date":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","size":$SIZE,"url":"$PUBLIC/findmycoach-latest.apk","versionUrl":"$PUBLIC/findmycoach-$VERSION.apk","commit":"${GITHUB_SHA::7}"}
          JSON
          curl -sSf -X POST "$BASE/version.json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "x-upsert: true" -H "Content-Type: application/json" -H "Cache-Control: max-age=60" \
            --data-binary @version.json
          echo "APK publié : $PUBLIC/findmycoach-latest.apk"
